[project]
name = "pharmalink"
version = "0.1.0"
description = "Production-ready SaaS Telegram pharmacy platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.111","aiogram>=3.4","sqlalchemy>=2","alembic>=1.13","asyncpg>=0.29","redis>=5","pydantic[email]>=2","pydantic-settings>=2","python-jose[cryptography]>=3.3","passlib[bcrypt]>=1.7", "bcrypt<5","httpx>=0.27","uvicorn[standard]>=0.30","structlog>=24","python-multipart>=0.0.9"]
[project.optional-dependencies]
dev = ["pytest>=8","pytest-asyncio>=0.23","ruff>=0.5","black>=24","aiosqlite>=0.20"]
[tool.black]
line-length = 100
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","UP","B","ASYNC"]
ignore = ["E501", "E701", "E702", "B008"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["pharmalink*"]

services:
  api:
    build: .
    command: uvicorn pharmalink.presentation.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 30s, timeout: 5s, retries: 3}
  bot:
    build: .
    command: python -m pharmalink.presentation.bot.main
    env_file: .env
    depends_on: [api, redis]
  sync:
    build: .
    command: python -m pharmalink.infrastructure.services.sync
    env_file: .env
    depends_on: [api]
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: pharmalink, POSTGRES_USER: pharmalink, POSTGRES_PASSWORD: pharmalink}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U pharmalink"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5}
volumes: {postgres_data: {}, redis_data: {}}

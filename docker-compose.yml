services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: melody, POSTGRES_PASSWORD: melody, POSTGRES_DB: melody}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn melody_ai.api.app:app --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
  bot:
    build: .
    command: python -m melody_ai.bot.app
    env_file: .env
    depends_on: [postgres, redis]
volumes: {postgres_data: {}, redis_data: {}}
